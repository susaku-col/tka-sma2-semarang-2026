<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ksp — TKA Kimia SMA Negeri 2 Semarang </title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Source+Sans+3:ital,wght@0,300;0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root {
  --bg: #0b1a17;
  --bg2: #0f2520;
  --card: #132e28;
  --card2: #183a33;
  --accent: #d4a04a;
  --text: #e8e2d6;
  --muted: #8fa89e;
  --success: #34d399;
  --error: #f87171;
  --border: #1e4a3f;
  --glow: rgba(212,160,74,0.12);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: "Source Sans 3", sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
  padding-top: 52px;
}
h1, h2, h3, .fd { font-family: "Playfair Display", serif; }

.bg-noise {
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: 0.025;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  z-index: 0;
}
.hg {
  position: absolute;
  width: 400px;
  height: 400px;
  border-radius: 50%;
  filter: blur(100px);
  opacity: 0.07;
  pointer-events: none;
}

.view { display: none; animation: fu 0.35s ease; }
.view.active { display: block; }
@keyframes fu { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:translateY(0); } }

.glow-card {
  transition: all 0.25s;
  border: 1px solid var(--border);
  background: var(--card);
  border-radius: 1rem;
  padding: 1.25rem;
  cursor: pointer;
}
.glow-card:hover {
  border-color: var(--accent);
  box-shadow: 0 0 24px var(--glow);
  transform: translateY(-2px);
}

.bp {
  background: linear-gradient(135deg, var(--accent), #c08930);
  color: #0b1a17;
  font-weight: 700;
  padding: 0.7rem 1.4rem;
  border-radius: 0.5rem;
  border: none;
  cursor: pointer;
  transition: all 0.2s;
  font-size: 0.93rem;
  font-family: inherit;
}
.bp:hover { transform: translateY(-1px); box-shadow: 0 4px 18px rgba(212,160,74,0.3); }

.bs {
  background: transparent;
  color: var(--accent);
  border: 1px solid var(--accent);
  padding: 0.55rem 1.1rem;
  border-radius: 0.5rem;
  cursor: pointer;
  transition: all 0.2s;
  font-weight: 600;
  font-size: 0.88rem;
  font-family: inherit;
}
.bs:hover { background: rgba(212,160,74,0.1); }

.ob {
  display: flex;
  align-items: flex-start;
  gap: 0.7rem;
  padding: 0.9rem 1.1rem;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 0.7rem;
  cursor: pointer;
  transition: all 0.22s;
  text-align: left;
  width: 100%;
  font-size: 0.93rem;
  color: var(--text);
  line-height: 1.55;
  font-family: inherit;
}
.ob:hover { border-color: var(--muted); background: var(--card); }
.ob.sel { border-color: var(--accent); background: rgba(212,160,74,0.08); }
.ob.ok { border-color: var(--success); background: rgba(52,211,153,0.1); }
.ob.no { border-color: var(--error); background: rgba(248,113,113,0.08); }
.ob.off { pointer-events: none; opacity: 0.82; }

.ck {
  width: 20px;
  height: 20px;
  min-width: 20px;
  border: 2px solid var(--border);
  border-radius: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
  margin-top: 2px;
}
.ob.sel .ck { border-color: var(--accent); background: var(--accent); }
.ob.ok .ck { border-color: var(--success); background: var(--success); }
.ob.no .ck { border-color: var(--error); background: var(--error); }

.stim {
  background: rgba(212,160,74,0.05);
  border-left: 3px solid var(--accent);
  padding: 0.9rem 1.1rem;
  border-radius: 0 0.5rem 0.5rem 0;
  margin-bottom: 1.1rem;
  font-size: 0.9rem;
  line-height: 1.6;
  color: var(--muted);
}

.expbox {
  border-radius: 0.7rem;
  padding: 0.9rem 1.1rem;
  margin-top: 1rem;
  font-size: 0.88rem;
  line-height: 1.6;
}
.expbox.good { background: rgba(52,211,153,0.06); border: 1px solid rgba(52,211,153,0.15); }
.expbox.bad { background: rgba(248,113,113,0.06); border: 1px solid rgba(248,113,113,0.15); }

.table-wrap {
  overflow-x: auto;
  margin: 0.75rem 0;
  border-radius: 0.5rem;
  border: 1px solid var(--border);
}
table.soal-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.85rem;
  background: var(--bg2);
}
table.soal-table th, table.soal-table td {
  padding: 0.5rem 0.75rem;
  border: 1px solid var(--border);
  text-align: center;
}
table.soal-table th { background: var(--card); color: var(--accent); font-weight: 600; }
table.soal-table td { color: var(--text); }
table.soal-table tr:hover { background: rgba(212,160,74,0.05); }

.badge {
  display: inline-flex;
  align-items: center;
  gap: 0.3rem;
  padding: 0.2rem 0.6rem;
  border-radius: 999px;
  font-size: 0.72rem;
  font-weight: 600;
}

.hots-badge {
  display: inline-block;
  padding: 0.15rem 0.5rem;
  border-radius: 999px;
  font-size: 0.6rem;
  font-weight: 700;
  margin-left: 0.5rem;
}
.hots-c3 { background: rgba(251,191,36,0.2); color: #fbbf24; }
.hots-c4 { background: rgba(249,115,22,0.2); color: #f97316; }
.hots-c5 { background: rgba(239,68,68,0.2); color: #ef4444; }
.hots-c6 { background: rgba(139,92,246,0.2); color: #8b5cf6; }

.toast {
  position: fixed;
  top: 1.2rem;
  right: 1.2rem;
  padding: 0.65rem 1.1rem;
  border-radius: 0.5rem;
  font-weight: 600;
  z-index: 1000;
  animation: fu 0.3s ease;
  pointer-events: none;
  font-size: 0.88rem;
  display: none;
}

.modal-bg {
  position: fixed;
  inset: 0;
  z-index: 50;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 1rem;
  background: rgba(0,0,0,0.55);
  backdrop-filter: blur(4px);
}
.modal-bg.open { display: flex; }

.sn { font-family: "Playfair Display", serif; font-size: 2.3rem; font-weight: 900; line-height: 1; }
.space-y-2\.5 > * + * { margin-top: 0.625rem; }

.chem-eq {
  display: block;
  text-align: center;
  padding: 0.5rem;
  font-family: "Times New Roman", serif;
  font-size: 1.05rem;
  background: var(--bg2);
  border-radius: 0.5rem;
  border: 1px solid var(--border);
  margin: 0.5rem 0;
}
.chem-eq sub { font-size: 0.7em; vertical-align: sub; }
.chem-eq sup { font-size: 0.7em; vertical-align: super; }

@media (max-width: 640px) {
  .sn { font-size: 1.7rem; }
  .ob { padding: 0.7rem 0.9rem; font-size: 0.88rem; }
  table.soal-table { font-size: 0.7rem; }
  table.soal-table th, table.soal-table td { padding: 0.3rem 0.4rem; }
}
</style>
</head>
<body>
<div class="bg-noise"></div>

<nav class="fixed top-0 left-0 right-0 z-40 backdrop-blur-md border-b" style="background:rgba(11,26,23,.88);border-color:var(--border)">
<div class="max-w-5xl mx-auto px-4 h-13 flex items-center justify-between" style="height:52px">
<button onclick="location.href='index.html'" class="flex items-center gap-2 text-sm font-bold tracking-wide" style="color:var(--accent);background:none;border:none;cursor:pointer;">
<i class="fa-solid fa-arrow-left"></i><span class="hidden sm:inline">Kembali</span>
</button>
<div class="flex items-center gap-3">
<span id="ns" class="hidden sm:flex items-center gap-1.5 text-xs" style="color:var(--muted)">
<i class="fa-solid fa-trophy" style="color:var(--accent)"></i><span id="nst">0/0</span>
</span>
<button onclick="location.href='index.html'" class="text-sm px-2.5 py-1 rounded" style="color:var(--muted);background:none;border:none;cursor:pointer;" onmouseover="this.style.color='var(--text)'" onmouseout="this.style.color='var(--muted)'">
<i class="fa-solid fa-house"></i>
</button>
</div>
</div>
</nav>

<div id="vHome" class="view active pt-16 pb-12 px-4">
<div class="max-w-4xl mx-auto">
<div class="relative rounded-2xl overflow-hidden mb-8 p-7 md:p-10" style="background:linear-gradient(135deg,var(--card),var(--card2))">
<div class="hg" style="background:var(--accent);top:-180px;right:-80px"></div>
<div class="hg" style="background:#34d399;bottom:-180px;left:-80px"></div>
<div class="relative z-10">
<div class="badge mb-3" style="background:rgba(212,160,74,.12);color:var(--accent)"><i class="fa-solid fa-flask"></i> Ksp</div>
<h1 class="fd text-3xl md:text-4xl font-black mb-2 leading-tight">Kelarutan & <span style="color:var(--accent)">Ksp</span></h1>
<p class="text-sm md:text-base max-w-lg mb-5" style="color:var(--muted);line-height:1.65">Latihan soal HOTS level C3-C6 tentang kelarutan, hasil kali kelarutan, pengaruh ion senama, dan aplikasi Ksp.</p>
<div class="flex flex-wrap gap-3">
<span class="badge hots-badge hots-c3">C3 - Menganalisis</span>
<span class="badge hots-badge hots-c4">C4 - Mengevaluasi</span>
<span class="badge hots-badge hots-c5">C5 - Mencipta</span>
<span class="badge hots-badge hots-c6">C6 - Menilai</span>
</div>
</div>
</div>

<div class="flex flex-wrap gap-2.5 mb-7">
<button onclick="startQuiz()" class="bp flex items-center gap-2"><i class="fa-solid fa-play"></i>Mulai Quiz Semua Soal</button>
<button onclick="startRandom()" class="bs flex items-center gap-2"><i class="fa-solid fa-shuffle"></i>Quiz Acak 10 Soal</button>
<button onclick="startWrong()" class="bs flex items-center gap-2" id="bWR" style="display:none"><i class="fa-solid fa-rotate-left"></i>Ulangi Salah</button>
<button onclick="resetAll()" class="bs flex items-center gap-2"><i class="fa-solid fa-trash-can"></i>Reset</button>
</div>

<div class="flex flex-wrap gap-2 mb-4">
<button onclick="filterLevel('all')" class="bs text-xs" id="filterAll" style="background:rgba(212,160,74,.15)">Semua</button>
<button onclick="filterLevel('c3')" class="bs text-xs" id="filterC3">C3</button>
<button onclick="filterLevel('c4')" class="bs text-xs" id="filterC4">C4</button>
<button onclick="filterLevel('c5')" class="bs text-xs" id="filterC5">C5</button>
<button onclick="filterLevel('c6')" class="bs text-xs" id="filterC6">C6</button>
</div>

<div id="qList"></div>
</div>
</div>

<div id="vQuiz" class="view pt-16 pb-12 px-4">
<div class="max-w-3xl mx-auto">
<div class="flex items-center justify-between mb-3">
<button onclick="openExit()" class="text-sm flex items-center gap-1.5" style="color:var(--muted);background:none;border:none;cursor:pointer;" onmouseover="this.style.color='var(--error)'" onmouseout="this.style.color='var(--muted)'"><i class="fa-solid fa-xmark"></i>Keluar</button>
<div class="flex items-center gap-2.5">
<span id="qCtr" class="text-sm font-semibold" style="color:var(--muted)"></span>
<span id="qTyp" class="badge" style="background:rgba(212,160,74,.12);color:var(--accent)"></span>
<span id="qLevel" class="badge" style="background:var(--bg2);color:var(--muted)"></span>
</div>
</div>
<div class="w-full h-1.5 rounded-full mb-5" style="background:var(--border)">
<div id="qBar" class="h-full rounded-full transition-all duration-400" style="background:var(--accent);width:0%"></div>
</div>
<div id="qArea"></div>
<div class="flex items-center justify-between mt-7">
<button id="bPrv" onclick="qPrev()" class="bs" style="visibility:hidden"><i class="fa-solid fa-chevron-left mr-1"></i>Sebelumnya</button>
<button id="bNxt" onclick="qNext()" class="bp">Selanjutnya<i class="fa-solid fa-chevron-right ml-1"></i></button>
</div>
</div>
</div>

<div id="vRes" class="view pt-16 pb-12 px-4">
<div class="max-w-3xl mx-auto text-center">
<div class="mb-7">
<svg class="mx-auto mb-3" style="transform:rotate(-90deg)" width="130" height="130" viewBox="0 0 130 130">
<circle cx="65" cy="65" r="55" fill="none" stroke="var(--border)" stroke-width="7"/>
<circle id="rRing" cx="65" cy="65" r="55" fill="none" stroke="var(--accent)" stroke-width="7" stroke-linecap="round" stroke-dasharray="345.6" stroke-dashoffset="345.6"/>
</svg>
<div class="sn" style="color:var(--accent)" id="rPct">0%</div>
<div class="text-sm mt-0.5" style="color:var(--muted)" id="rLbl">—</div>
</div>
<div class="grid grid-cols-3 gap-3 mb-7">
<div class="rounded-xl p-3.5" style="background:var(--card);border:1px solid var(--border)"><div class="text-2xl font-bold" style="color:var(--success)" id="rOk">0</div><div class="text-xs mt-0.5" style="color:var(--muted)">Benar</div></div>
<div class="rounded-xl p-3.5" style="background:var(--card);border:1px solid var(--border)"><div class="text-2xl font-bold" style="color:var(--error)" id="rNo">0</div><div class="text-xs mt-0.5" style="color:var(--muted)">Salah</div></div>
<div class="rounded-xl p-3.5" style="background:var(--card);border:1px solid var(--border)"><div class="text-2xl font-bold" id="rTot">0</div><div class="text-xs mt-0.5" style="color:var(--muted)">Total</div></div>
</div>
<div class="flex flex-wrap justify-center gap-2.5">
<button onclick="location.href='index.html'" class="bs"><i class="fa-solid fa-house mr-1"></i>Beranda</button>
<button onclick="revWrong()" class="bp" id="bRW" style="display:none"><i class="fa-solid fa-eye mr-1"></i>Review Salah</button>
<button onclick="retryQ()" class="bs"><i class="fa-solid fa-rotate-left mr-1"></i>Ulangi</button>
</div>
</div>
</div>

<div id="vRev" class="view pt-16 pb-12 px-4">
<div class="max-w-3xl mx-auto">
<button onclick="backRev()" class="flex items-center gap-2 text-sm mb-5" style="color:var(--muted);background:none;border:none;cursor:pointer;"><i class="fa-solid fa-arrow-left"></i>Kembali</button>
<div id="revA"></div>
<div class="flex justify-center gap-2.5 mt-7">
<button id="rvPr" onclick="rvNav(-1)" class="bs"><i class="fa-solid fa-chevron-left mr-1"></i>Sebelumnya</button>
<button id="rvNx" onclick="rvNav(1)" class="bp">Selanjutnya<i class="fa-solid fa-chevron-right ml-1"></i></button>
</div>
</div>
</div>

<div id="exMod" class="modal-bg">
<div class="rounded-xl p-5 max-w-sm w-full" style="background:var(--card);border:1px solid var(--border)">
<h3 class="fd text-lg font-bold mb-1.5">Keluar dari Quiz?</h3>
<p class="text-sm mb-4" style="color:var(--muted)">Progress quiz ini akan hilang.</p>
<div class="flex gap-2.5 justify-end">
<button onclick="closeMod()" class="bs text-sm">Batal</button>
<button onclick="doExit()" class="text-sm font-bold px-4 py-2 rounded-lg border-none cursor-pointer" style="background:var(--error);color:#fff">Keluar</button>
</div>
</div>
</div>
<div id="toast" class="toast" style="display:none"></div>

<script>
// ============================================================
// DATA SOAL Ksp - HOTS C3 - C6
// ============================================================
var QS = [];

// ============================================================
// LEVEL C3 - Menganalisis
// ============================================================

// SOAL C3.1 - Menentukan Ksp dari kelarutan
QS.push({
  id: 3001,
  topic: "ksp",
  type: "single",
  level: "c3",
  stim: `
    <div style="margin-bottom:0.5rem;">
      <strong>Diketahui kelarutan Mg(OH)₂ dalam air murni pada suhu 25°C adalah 2,5 × 10⁻⁴ mol/L.</strong>
    </div>
  `,
  q: "Nilai Ksp Mg(OH)₂ pada suhu tersebut adalah...",
  opts: [
    "6,25 × 10⁻¹¹",
    "1,25 × 10⁻¹⁰",
    "6,25 × 10⁻¹⁰",
    "1,25 × 10⁻⁹",
    "6,25 × 10⁻⁹"
  ],
  ans: 0,
  exp: "Mg(OH)₂ ⇌ Mg²⁺ + 2OH⁻. Jika kelarutan = s, maka [Mg²⁺] = s = 2,5×10⁻⁴, [OH⁻] = 2s = 5×10⁻⁴. Ksp = [Mg²⁺][OH⁻]² = (2,5×10⁻⁴)(5×10⁻⁴)² = (2,5×10⁻⁴)(25×10⁻⁸) = 6,25×10⁻¹¹."
});

// SOAL C3.2 - Kelarutan dari Ksp
QS.push({
  id: 3002,
  topic: "ksp",
  type: "single",
  level: "c3",
  stim: `
    <div style="margin-bottom:0.5rem;">
      <strong>Ksp PbI₂ = 7,1 × 10⁻⁹ pada 25°C.</strong>
    </div>
  `,
  q: "Kelarutan PbI₂ dalam air murni adalah...",
  opts: [
    "1,2 × 10⁻³ M",
    "2,4 × 10⁻³ M",
    "3,6 × 10⁻³ M",
    "4,8 × 10⁻³ M",
    "6,0 × 10⁻³ M"
  ],
  ans: 0,
  exp: "PbI₂ ⇌ Pb²⁺ + 2I⁻. Ksp = 4s³. s = ∛(Ksp/4) = ∛(7,1×10⁻⁹/4) = ∛(1,775×10⁻⁹) = 1,21×10⁻³ M."
});

// SOAL C3.3 - Pengaruh ion senama
QS.push({
  id: 3003,
  topic: "ksp",
  type: "mcma",
  level: "c3",
  stim: `
    <div style="margin-bottom:0.5rem;">
      <strong>Perhatikan pernyataan-pernyataan berikut tentang pengaruh ion senama terhadap kelarutan!</strong>
    </div>
  `,
  q: "Pernyataan yang BENAR tentang pengaruh ion senama adalah... (Pilih 2 jawaban benar)",
  opts: [
    "Penambahan ion senama akan menurunkan kelarutan senyawa",
    "Penambahan ion senama akan meningkatkan kelarutan senyawa",
    "Penambahan ion senama tidak mempengaruhi kelarutan",
    "Penambahan Na₂SO₄ ke dalam larutan CaSO₄ menurunkan kelarutan CaSO₄",
    "Penambahan NaCl ke dalam larutan AgCl menurunkan kelarutan AgCl"
  ],
  ans: [0, 3],
  exp: "Ion senama menurunkan kelarutan (efek ion senama/efek pengendapan). Na₂SO₄ mengandung SO₄²⁻ yang merupakan ion senama dengan CaSO₄, sehingga menurunkan kelarutan CaSO₄."
});

// SOAL C3.4 - Memprediksi pengendapan
QS.push({
  id: 3004,
  topic: "ksp",
  type: "single",
  level: "c3",
  stim: `
    <div style="margin-bottom:0.5rem;">
      <strong>Ksp AgCl = 1,8 × 10⁻¹⁰. Jika 10 mL larutan AgNO₃ 0,01 M dicampur dengan 10 mL larutan NaCl 0,001 M.</strong>
    </div>
  `,
  q: "Apakah AgCl akan mengendap?",
  opts: [
    "Ya, karena Q > Ksp",
    "Ya, karena Q < Ksp",
    "Tidak, karena Q < Ksp",
    "Tidak, karena Q > Ksp",
    "Tidak dapat ditentukan"
  ],
  ans: 2,
  exp: "Setelah pencampuran: [Ag⁺] = 0,01 × 10/20 = 0,005 M. [Cl⁻] = 0,001 × 10/20 = 0,0005 M. Q = [Ag⁺][Cl⁻] = 0,005 × 0,0005 = 2,5 × 10⁻⁶. Q (2,5×10⁻⁶) > Ksp (1,8×10⁻¹⁰), sehingga AgCl mengendap. Jawaban yang benar: Ya, karena Q > Ksp."
});

// ============================================================
// LEVEL C4 - Mengevaluasi
// ============================================================

// SOAL C4.1 - Membandingkan kelarutan
QS.push({
  id: 4001,
  topic: "ksp",
  type: "mcma",
  level: "c4",
  stim: `
    <div style="margin-bottom:0.5rem;">
      <strong>Data Ksp beberapa senyawa:</strong>
    </div>
    <div class="table-wrap">
      <table class="soal-table">
        <tr><th>Senyawa</th><th>Ksp</th></tr>
        <tr><td>AgCl</td><td>1,8 × 10⁻¹⁰</td></tr>
        <tr><td>AgBr</td><td>5,0 × 10⁻¹³</td></tr>
        <tr><td>AgI</td><td>8,3 × 10⁻¹⁷</td></tr>
        <tr><td>Ag₂CrO₄</td><td>1,1 × 10⁻¹²</td></tr>
      </table>
    </div>
  `,
  q: "Pernyataan yang BENAR berdasarkan data di atas adalah... (Pilih 2 jawaban benar)",
  opts: [
    "Kelarutan AgCl > AgBr > AgI",
    "Kelarutan AgBr > AgCl > AgI",
    "Ag₂CrO₄ memiliki kelarutan molar sekitar 6,5 × 10⁻⁵ M",
    "AgI memiliki kelarutan terkecil",

var S = {
  view: "home",
  qids: [],
  qi: 0,
  ans: {},
  mode: "topic",
  ri: 0,
  rqs: [],
  wrong: [],
  done: {},
  scores: {},
  filter: "all"
};

function load() {
  try {
    var d = JSON.parse(localStorage.getItem("tka_kim_ksp"));
    if (d) {
      S.done = {};
      (d.done || []).forEach(function(x) { S.done[x] = true; });
      S.wrong = d.wrong || [];
      S.scores = d.scores || {};
    }
  } catch(e) {}
}
function save() {
  try {
    localStorage.setItem("tka_kim_ksp", JSON.stringify({
      done: Object.keys(S.done),
      wrong: S.wrong,
      scores: S.scores
    }));
  } catch(e) {}
}
load();

function goHome() { location.href = 'index.html'; }

function go(v) {
  var names = {home:"vHome", quiz:"vQuiz", res:"vRes", rev:"vRev"};
  document.querySelectorAll(".view").forEach(function(el) { el.classList.remove("active"); });
  var el = document.getElementById(names[v]);
  if (el) el.classList.add("active");
  S.view = v;
  window.scrollTo(0, 0);
  if (v === "home") renderHome();
}

function renderHome() {
  document.getElementById("bWR").style.display = S.wrong.length > 0 ? "flex" : "none";
  updateNS();
  renderList();
}

function updateNS() {
  var tc = 0, cc = 0;
  for (var k in S.scores) { tc += S.scores[k].t; cc += S.scores[k].c; }
  document.getElementById("nst").textContent = tc > 0 ? cc + "/" + tc : "0/0";
}

function getLevelBadge(level) {
  var labels = {c3:"C3", c4:"C4", c5:"C5", c6:"C6"};
  var colors = {c3:"#fbbf24", c4:"#f97316", c5:"#ef4444", c6:"#8b5cf6"};
  var bgColors = {
    c3:"rgba(251,191,36,0.15)",
    c4:"rgba(249,115,22,0.15)",
    c5:"rgba(239,68,68,0.15)",
    c6:"rgba(139,92,246,0.15)"
  };
  return '<span class="badge" style="background:' + bgColors[level] + ';color:' + colors[level] + ';font-size:0.65rem;">' + labels[level] + '</span>';
}

function renderList() {
  var list = document.getElementById("qList");
  list.innerHTML = "";
  var filtered = QS.filter(function(q) {
    if (S.filter === "all") return true;
    return q.level === S.filter;
  });
  filtered.forEach(function(q, i) {
    var answered = S.done[q.id];
    var wasWrong = S.wrong.indexOf(q.id) >= 0;
    var tl = q.type === "mcma" ? "MCMA" : "Pilihan Ganda";
    var levelLabel = q.level ? getLevelBadge(q.level) : "";

    var d = document.createElement("div");
    d.className = "glow-card rounded-lg p-3.5 mb-2.5 cursor-pointer flex items-center gap-3";
    d.style.background = "var(--card)";
    d.onclick = function() { singleQ(q.id); };
    d.innerHTML =
      '<div class="w-9 h-9 rounded-lg flex items-center justify-center text-sm font-bold" style="background:' +
        (answered ? (wasWrong ? 'rgba(248,113,113,.12);color:var(--error)' : 'rgba(52,211,153,.12);color:var(--success)') : 'var(--bg2);color:var(--muted)') +
      '">' + (answered ? (wasWrong ? '<i class="fa-solid fa-xmark"></i>' : '<i class="fa-solid fa-check"></i>') : (i + 1)) + '</div>' +
      '<div class="flex-1 min-w-0">' +
        '<div class="text-sm font-semibold mb-0.5 truncate" style="color:var(--text)">' + plain(q.q).substring(0, 75) + (q.q.length > 75 ? '...' : '') + '</div>' +
        '<div class="flex items-center gap-2 flex-wrap">' +
          '<span class="badge" style="background:var(--bg2);color:var(--muted);font-size:.68rem">' + tl + '</span>' +
          levelLabel +
        '</div>' +
      '</div>' +
      '<i class="fa-solid fa-chevron-right text-xs" style="color:var(--border)"></i>';
    list.appendChild(d);
  });
}

function filterLevel(level) {
  S.filter = level;
  document.querySelectorAll('[id^="filter"]').forEach(function(el) {
    el.style.background = "transparent";
  });
  var btn = document.getElementById("filter" + level.toUpperCase());
  if (btn) btn.style.background = "rgba(212,160,74,.15)";
  renderList();
}

function plain(html) {
  var d = document.createElement("div");
  d.innerHTML = html;
  return d.textContent || "";
}

function startQuiz() {
  S.qids = QS.map(function(q) { return q.id; });
  S.ans = {}; S.qi = 0; S.mode = "topic";
  go("quiz"); renderQ();
}

function startRandom() {
  var sh = QS.slice().sort(function() { return Math.random() - 0.5; }).slice(0, 10);
  S.qids = sh.map(function(q) { return q.id; });
  S.ans = {}; S.qi = 0; S.mode = "random";
  go("quiz"); renderQ();
}

function startWrong() {
  var wq = QS.filter(function(q) { return S.wrong.indexOf(q.id) >= 0; });
  if (wq.length === 0) return;
  S.qids = wq.map(function(q) { return q.id; });
  S.ans = {}; S.qi = 0; S.mode = "wrong";
  go("quiz"); renderQ();
}

function singleQ(qid) {
  S.qids = [qid]; S.ans = {}; S.qi = 0; S.mode = "single";
  go("quiz"); renderQ();
}

function renderQ() {
  var qid = S.qids[S.qi];
  var q = QS.find(function(x) { return x.id === qid; });
  if (!q) return;
  var total = S.qids.length;
  var idx = S.qi + 1;
  var pct = Math.round(idx / total * 100);

  document.getElementById("qCtr").textContent = idx + " / " + total;
  document.getElementById("qBar").style.width = pct + "%";
  var tl = {single: "Pilihan Ganda", mcma: "MCMA"};
  document.getElementById("qTyp").textContent = tl[q.type] || q.type;
  var levelLabels = {c3:"C3 - Menganalisis", c4:"C4 - Mengevaluasi", c5:"C5 - Mencipta", c6:"C6 - Menilai"};
  document.getElementById("qLevel").textContent = q.level ? levelLabels[q.level] : "";
  document.getElementById("bPrv").style.visibility = S.qi > 0 ? "visible" : "hidden";
  var isLast = S.qi === total - 1;
  document.getElementById("bNxt").innerHTML = isLast ? "Selesai <i class='fa-solid fa-check ml-1'></i>" : "Selanjutnya <i class='fa-solid fa-chevron-right ml-1'></i>";

  var h = "";
  if (q.stim) h += '<div class="stim">' + q.stim + '</div>';
  h += '<h3 class="font-bold text-base mb-4 leading-relaxed" style="color:var(--text)">' + q.q + '</h3>';

  if (q.type === "single") {
    var letters = "ABCDE";
    h += '<div class="space-y-2.5">';
    q.opts.forEach(function(opt, i) {
      var sel = S.ans[qid] === i;
      h += '<button class="ob' + (sel ? ' sel' : '') + '" onclick="selS(' + qid + ',' + i + ')">' +
        '<span class="w-7 h-7 min-w-[1.75rem] rounded-full border-2 flex items-center justify-center text-xs font-bold" style="border-color:' + (sel ? 'var(--accent)' : 'var(--border)') + ';color:' + (sel ? 'var(--accent)' : 'var(--muted)') + '">' + letters[i] + '</span>' +
        '<span>' + opt + '</span></button>';
    });
    h += '</div>';
  } else if (q.type === "mcma") {
    var ua = S.ans[qid] || [];
    h += '<div class="space-y-2.5">';
    q.opts.forEach(function(opt, i) {
      var sel = ua.indexOf(i) >= 0;
      h += '<button class="ob' + (sel ? ' sel' : '') + '" onclick="togM(' + qid + ',' + i + ')">' +
        '<div class="ck">' + (sel ? '<i class="fa-solid fa-check text-xs" style="color:#0b1a17"></i>' : '') + '</div>' +
        '<span>' + opt + '</span></button>';
    });
    h += '</div>';
    h += '<p class="text-xs mt-2.5" style="color:var(--muted)"><i class="fa-solid fa-circle-info mr-1"></i>Pilih SEMUA jawaban yang benar</p>';
  }
  document.getElementById("qArea").innerHTML = h;
}

function selS(qid, i) { S.ans[qid] = i; renderQ(); }
function togM(qid, i) {
  if (!S.ans[qid]) S.ans[qid] = [];
  var arr = S.ans[qid];
  var idx = arr.indexOf(i);
  if (idx >= 0) arr.splice(idx, 1); else arr.push(i);
  renderQ();
}

function qNext() {
  if (S.qi === S.qids.length - 1) { finishQ(); return; }
  S.qi++; renderQ(); window.scrollTo(0, 0);
}
function qPrev() {
  if (S.qi > 0) { S.qi--; renderQ(); window.scrollTo(0, 0); }
}

function finishQ() {
  var correct = 0, wrong = 0;
  var ts = {};

  S.qids.forEach(function(qid) {
    var q = QS.find(function(x) { return x.id === qid; });
    if (!q) return;
    var ua = S.ans[qid];
    var ok = false;

    if (q.type === "single") {
      ok = ua === q.ans;
    } else if (q.type === "mcma") {
      var u = (ua || []).slice().sort().join(",");
      var c = q.ans.slice().sort().join(",");
      ok = u === c;
    }

    S.done[qid] = true;
    if (ok) { correct++; } else { wrong++; S.wrong.push(qid); }

    if (!ts[q.topic]) ts[q.topic] = {c:0, t:0};
    ts[q.topic].t++;
    if (ok) ts[q.topic].c++;
  });

  S.wrong = uniq(S.wrong);
  for (var k in ts) {
    if (!S.scores[k]) S.scores[k] = {c:0, t:0};
    S.scores[k].c += ts[k].c;
    S.scores[k].t += ts[k].t;
  }
  save();

  var total = correct + wrong;
  var pct = total > 0 ? Math.round(correct / total * 100) : 0;
  document.getElementById("rPct").textContent = pct + "%";
  document.getElementById("rOk").textContent = correct;
  document.getElementById("rNo").textContent = wrong;
  document.getElementById("rTot").textContent = total;

  var circ = 2 * Math.PI * 55;
  var ring = document.getElementById("rRing");
  ring.style.strokeDasharray = circ;
  ring.style.strokeDashoffset = circ - (circ * pct / 100);
  ring.style.stroke = pct >= 70 ? "var(--success)" : pct >= 40 ? "var(--accent)" : "var(--error)";

  var lbl = pct >= 90 ? "Luar Biasa!" : pct >= 70 ? "Bagus Sekali!" : pct >= 50 ? "Cukup Baik" : "Perlu Belajar Lagi";
  document.getElementById("rLbl").textContent = lbl;
  document.getElementById("bRW").style.display = wrong > 0 ? "inline-flex" : "none";
  go("res");
}

function uniq(arr) {
  var seen = {}, out = [];
  arr.forEach(function(x) { if (!seen[x]) { seen[x] = true; out.push(x); } });
  return out;
}

function retryQ() {
  if (S.mode === "topic") startQuiz();
  else if (S.mode === "random") startRandom();
  else if (S.mode === "wrong") startWrong();
  else if (S.mode === "single") singleQ(S.qids[0]);
}

function revWrong() {
  var wqs = S.qids.filter(function(qid) { return S.wrong.indexOf(qid) >= 0; });
  if (wqs.length === 0) { toast("Tidak ada jawaban salah", "var(--success)"); return; }
  S.rqs = wqs.map(function(qid) { return QS.find(function(x) { return x.id === qid; }); }).filter(Boolean);
  S.ri = 0;
  go("rev"); renderRev();
}

function renderRev() {
  var q = S.rqs[S.ri];
  if (!q) return;
  var total = S.rqs.length;
  document.getElementById("rvPr").style.visibility = S.ri > 0 ? "visible" : "hidden";
  document.getElementById("rvNx").innerHTML = S.ri === total - 1 ? "Kembali <i class='fa-solid fa-check ml-1'></i>" : "Selanjutnya <i class='fa-solid fa-chevron-right ml-1'></i>";

  var ua = S.ans[q.id];
  var ok = false;
  if (q.type === "single") ok = ua === q.ans;
  else if (q.type === "mcma") {
    var u = (ua || []).slice().sort().join(",");
    ok = u === q.ans.slice().sort().join(",");
  }

  var letters = "ABCDE";
  var h = '<div class="text-xs mb-2 font-semibold" style="color:var(--muted)">Soal ' + (S.ri + 1) + " / " + total + '</div>';
  if (q.stim) h += '<div class="stim">' + q.stim + '</div>';
  h += '<h3 class="font-bold text-sm mb-4 leading-relaxed">' + q.q + '</h3>';
  h += '<div class="space-y-2.5">';

  if (q.type === "single") {
    q.opts.forEach(function(opt, i) {
      var cls = "off";
      if (i === q.ans) cls += " ok";
      else if (ua === i && i !== q.ans) cls += " no";
      h += '<button class="ob ' + cls + '">' +
        '<span class="w-7 h-7 min-w-[1.75rem] rounded-full border-2 flex items-center justify-center text-xs font-bold" style="border-color:' + (i === q.ans ? "var(--success)" : ua === i ? "var(--error)" : "var(--border)") + ';color:' + (i === q.ans ? "var(--success)" : ua === i ? "var(--error)" : "var(--muted)") + '">' + letters[i] + '</span>' +
        '<span>' + opt + '</span>' +
        (i === q.ans ? '<i class="fa-solid fa-circle-check ml-auto" style="color:var(--success)"></i>' : '') +
        (ua === i && i !== q.ans ? '<i class="fa-solid fa-circle-xmark ml-auto" style="color:var(--error)"></i>' : '') +
      '</button>';
    });
  } else if (q.type === "mcma") {
    q.opts.forEach(function(opt, i) {
      var isUA = (ua || []).indexOf(i) >= 0;
      var isCA = q.ans.indexOf(i) >= 0;
      var cls = "off";
      if (isCA) cls += " ok";
      else if (isUA && !isCA) cls += " no";
      h += '<button class="ob ' + cls + '">' +
        '<div class="ck">' + (isCA ? '<i class="fa-solid fa-check text-xs" style="color:#0b1a17"></i>' : isUA ? '<i class="fa-solid fa-xmark text-xs" style="color:#fff"></i>' : '') + '</div>' +
        '<span>' + opt + '</span></button>';
    });
  }
  h += '</div>';
  h += '<div class="expbox ' + (ok ? 'good' : 'bad') + '">' +
    '<div class="flex items-center gap-2 mb-1.5 font-bold text-sm">' +
      '<i class="fa-solid ' + (ok ? 'fa-circle-check' : 'fa-circle-xmark') + '" style="color:' + (ok ? 'var(--success)' : 'var(--error)') + '"></i>' +
      (ok ? 'Jawaban Benar' : 'Jawaban Salah') +
    '</div>' +
    '<p style="color:var(--text);line-height:1.6">' + q.exp + '</p>' +
  '</div>';

  document.getElementById("revA").innerHTML = h;
  window.scrollTo(0, 0);
}

function rvNav(dir) {
  if (dir === 1 && S.ri === S.rqs.length - 1) { backRev(); return; }
  S.ri = Math.max(0, Math.min(S.rqs.length - 1, S.ri + dir));
  renderRev();
}
function backRev() {
  if (S.mode === "single") goHome();
  else go("res");
}

function openExit() { document.getElementById("exMod").classList.add("open"); }
function closeMod() { document.getElementById("exMod").classList.remove("open"); }
function doExit() { closeMod(); goHome(); }

function resetAll() {
  S.done = {}; S.wrong = []; S.scores = {};
  save(); renderHome(); toast("Progress berhasil direset", "var(--success)");
}
function toast(msg, bg) {
  var t = document.getElementById("toast");
  t.style.display = "block"; 
  t.style.background = bg || "var(--card)"; 
  t.style.color = "#fff"; 
  t.textContent = msg;
  setTimeout(function() { t.style.display = "none"; }, 2200);
}

renderHome();
console.log("Ksp - HOTS C3-C6 loaded: " + QS.length + " soal");
</script>
</body>
</html>
