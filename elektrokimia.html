<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elektrokimia — TKA Kimia SMA Negeri 2 Semarang</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Source+Sans+3:ital,wght@0,300;0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
    :root {
        --bg: #0b1a17; --bg2: #132a24; --card: #1a3a32; --card2: #1e4a3f;
        --text: #e8f0ec; --muted: #8aa8a0; --border: #2a4a42; --accent: #d4a04a;
        --success: #34d399; --error: #f87171; --glow: rgba(212, 160, 74, 0.15);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: 'Source Sans 3', sans-serif;
        background: var(--bg); color: var(--text);
        min-height: 100vh; padding-top: 52px;
    }
    .fd { font-family: 'Playfair Display', serif; }
    .bg-noise {
        position: fixed; top:0; left:0; right:0; bottom:0;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
        pointer-events: none; z-index: 0;
    }
    .hg {
        position: absolute; width:300px; height:300px;
        border-radius: 50%; filter: blur(100px);
        opacity: 0.15; pointer-events: none;
    }
    .badge {
        display: inline-flex; align-items: center; gap: 6px;
        padding: 4px 14px; border-radius: 100px;
        font-size: 0.75rem; font-weight: 600;
        background: rgba(212,160,74,0.12); color: var(--accent);
    }
    .glow-card {
        background: var(--card); border: 1px solid var(--border);
        border-radius: 12px; padding: 16px 18px; cursor: pointer;
        transition: all 0.25s ease; display: flex;
        align-items: center; gap: 12px;
        text-decoration: none; color: inherit;
    }
    .glow-card:hover {
        border-color: var(--accent); background: var(--card2);
        box-shadow: 0 0 20px var(--glow);
    }
    .bp {
        background: var(--accent); color: #0b1a17; border: none;
        padding: 8px 18px; border-radius: 30px; font-weight: 700;
        font-size: 0.85rem; cursor: pointer; transition: all 0.25s ease;
        display: inline-flex; align-items: center; gap: 6px;
    }
    .bp:hover { background: #e8b84a; transform: scale(1.02); }
    .bs {
        background: transparent; color: var(--text);
        border: 1px solid var(--border); padding: 8px 18px;
        border-radius: 30px; font-weight: 600; font-size: 0.85rem;
        cursor: pointer; transition: all 0.25s ease;
        display: inline-flex; align-items: center; gap: 6px;
    }
    .bs:hover { border-color: var(--accent); background: var(--card2); }
    .view { display: none; }
    .view.active { display: block; }
    .stim {
        background: var(--bg2); padding: 12px 16px;
        border-radius: 8px; border-left: 3px solid var(--accent);
        margin-bottom: 12px; font-size: 0.9rem;
        line-height: 1.6; color: var(--muted);
    }
    .table-wrap {
        overflow-x: auto; margin: 8px 0;
        border-radius: 8px; border: 1px solid var(--border);
    }
    table.soal-table {
        width: 100%; border-collapse: collapse;
        font-size: 0.8rem; background: var(--bg2);
    }
    table.soal-table th {
        background: var(--card); color: var(--accent);
        font-weight: 600; padding: 6px 10px;
        border: 1px solid var(--border); text-align: center;
    }
    table.soal-table td {
        padding: 6px 10px; border: 1px solid var(--border);
        text-align: center; color: var(--text);
    }
    table.soal-table tr:hover { background: rgba(212,160,74,0.05); }
    .figure-wrap {
        display: flex; flex-direction: column; align-items: center;
        margin: 8px 0; padding: 10px; background: var(--bg2);
        border-radius: 8px; border: 1px solid var(--border);
    }
    .figure-wrap svg { max-width: 100%; height: auto; }
    .figure-caption {
        font-size: 0.7rem; color: var(--muted);
        margin-top: 4px; text-align: center;
    }
    .chem-eq {
        display: block; text-align: center;
        padding: 0.5rem 0.75rem;
        font-family: "Times New Roman", serif;
        font-size: 1rem; background: var(--bg2);
        border-radius: 0.5rem; border: 1px solid var(--border);
        margin: 0.5rem 0; color: var(--text);
    }
    .space-y-2\.5 > * + * { margin-top: 8px; }
    .ob {
        display: flex; align-items: center; gap: 10px;
        width: 100%; padding: 8px 14px; border-radius: 8px;
        border: 1px solid var(--border); background: var(--bg2);
        color: var(--text); cursor: pointer;
        transition: all 0.2s ease; font-size: 0.9rem; text-align: left;
    }
    .ob:hover { border-color: var(--muted); }
    .ob.sel { border-color: var(--accent); background: rgba(212,160,74,0.1); }
    .ob .ck {
        width: 20px; height: 20px; min-width: 20px;
        border-radius: 4px; border: 2px solid var(--border);
        display: flex; align-items: center; justify-content: center;
        font-size: 0.7rem; background: var(--bg);
    }
    .ob.sel .ck { border-color: var(--accent); background: var(--accent); }
    .ob.ok .ck { border-color: var(--success); background: var(--success); }
    .ob.no .ck { border-color: var(--error); background: var(--error); }
    .modal-bg {
        display: none; position: fixed; inset: 0;
        background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
        z-index: 50; justify-content: center; align-items: center;
        padding: 20px;
    }
    .modal-bg.open { display: flex; }
    .toast {
        position: fixed; bottom: 30px; left: 50%;
        transform: translateX(-50%); padding: 12px 28px;
        border-radius: 12px; font-weight: 600; z-index: 100;
        background: var(--card); border: 1px solid var(--border);
        color: var(--text); max-width: 90%; text-align: center;
    }
    .hots-badge {
        display: inline-block; padding: 0.15rem 0.5rem;
        border-radius: 999px; font-size: 0.6rem;
        font-weight: 700; margin-left: 0.5rem;
    }
    .hots-c2 { background: rgba(52,211,153,0.2); color: #34d399; }
    .hots-c3 { background: rgba(251,191,36,0.2); color: #fbbf24; }
    .hots-c4 { background: rgba(249,115,22,0.2); color: #f97316; }
    .hots-c5 { background: rgba(239,68,68,0.2); color: #ef4444; }
    .hots-c6 { background: rgba(139,92,246,0.2); color: #8b5cf6; }
    .expbox {
        margin-top: 14px; padding: 14px 18px;
        border-radius: 8px; font-size: 0.9rem; line-height: 1.7;
    }
    .expbox.good {
        background: rgba(52,211,153,0.06);
        border-left: 4px solid var(--success);
    }
    .expbox.bad {
        background: rgba(248,113,113,0.06);
        border-left: 4px solid var(--error);
    }
    @media (max-width: 640px) {
        .ob { font-size: 0.8rem; padding: 6px 12px; }
        .bp, .bs { font-size: 0.75rem; padding: 6px 14px; }
        .glow-card { padding: 12px 14px; }
    }
</style>
</head>
<body>
<div class="bg-noise"></div>

<nav class="fixed top-0 left-0 right-0 z-40 backdrop-blur-md border-b" style="background:rgba(11,26,23,.88);border-color:var(--border)">
<div class="max-w-5xl mx-auto px-4 flex items-center justify-between" style="height:52px">
<button onclick="location.href='index.html'" class="flex items-center gap-2 text-sm font-bold tracking-wide" style="color:var(--accent);background:none;border:none;cursor:pointer;">
<i class="fa-solid fa-arrow-left"></i><span class="hidden sm:inline">Kembali</span>
</button>
<div class="flex items-center gap-3">
<span class="hidden sm:flex items-center gap-1.5 text-xs" style="color:var(--muted)">
<i class="fa-solid fa-trophy" style="color:var(--accent)"></i><span id="nst">0/0</span>
</span>
<button onclick="location.href='index.html'" class="text-sm px-2.5 py-1 rounded" style="color:var(--muted);background:none;border:none;cursor:pointer;">
<i class="fa-solid fa-house"></i>
</button>
</div>
</div>
</nav>

<!-- HOME -->
<div id="vHome" class="view active pt-16 pb-12 px-4">
<div class="max-w-4xl mx-auto">
    <div class="relative rounded-2xl overflow-hidden mb-8 p-7 md:p-10" style="background:linear-gradient(135deg,var(--card),var(--card2))">
        <div class="hg" style="background:var(--accent);top:-180px;right:-80px"></div>
        <div class="hg" style="background:#34d399;bottom:-180px;left:-80px"></div>
        <div class="relative z-10">
            <div class="badge mb-3"><i class="fa-solid fa-bolt"></i> Elektrokimia</div>
            <h1 class="fd text-3xl md:text-4xl font-black mb-2 leading-tight">Elektro<span style="color:var(--accent)">kimia</span></h1>
            <p class="text-sm md:text-base max-w-lg" style="color:var(--muted);line-height:1.65">Latihan soal HOTS level C2-C6 tentang sel volta, sel elektrolisis, hukum Faraday, dan aplikasi elektrokimia.</p>
            <div class="flex flex-wrap gap-2 mt-4">
                <span class="badge hots-badge hots-c2">C2 - Pemahaman</span>
                <span class="badge hots-badge hots-c3">C3 - Menganalisis</span>
                <span class="badge hots-badge hots-c4">C4 - Mengevaluasi</span>
                <span class="badge hots-badge hots-c5">C5 - Mencipta</span>
                <span class="badge hots-badge hots-c6">C6 - Menilai</span>
            </div>
        </div>
    </div>

    <div class="flex flex-wrap gap-2.5 mb-6">
        <button onclick="startQuiz()" class="bp"><i class="fa-solid fa-play"></i> Mulai Quiz Semua Soal</button>
        <button onclick="startRandom()" class="bs"><i class="fa-solid fa-shuffle"></i> Quiz Acak 10 Soal</button>
        <button onclick="startWrong()" class="bs" id="bWR" style="display:none"><i class="fa-solid fa-rotate-left"></i> Ulangi Salah</button>
        <button onclick="resetAll()" class="bs"><i class="fa-solid fa-trash-can"></i> Reset</button>
    </div>

    <div class="flex flex-wrap gap-2 mb-4">
        <button onclick="filterLevel('all')" class="bs text-xs" id="filterAll" style="background:rgba(212,160,74,.15)">Semua</button>
        <button onclick="filterLevel('c2')" class="bs text-xs" id="filterC2">C2</button>
        <button onclick="filterLevel('c3')" class="bs text-xs" id="filterC3">C3</button>
        <button onclick="filterLevel('c4')" class="bs text-xs" id="filterC4">C4</button>
        <button onclick="filterLevel('c5')" class="bs text-xs" id="filterC5">C5</button>
        <button onclick="filterLevel('c6')" class="bs text-xs" id="filterC6">C6</button>
    </div>

    <div id="qList"></div>
</div>
</div>

<!-- QUIZ -->
<div id="vQuiz" class="view pt-16 pb-12 px-4">
<div class="max-w-3xl mx-auto">
    <div class="flex items-center justify-between mb-3">
        <button onclick="openExit()" class="text-sm flex items-center gap-1.5" style="color:var(--muted);background:none;border:none;cursor:pointer;"><i class="fa-solid fa-xmark"></i>Keluar</button>
        <div class="flex items-center gap-2.5">
            <span id="qCtr" class="text-sm font-semibold" style="color:var(--muted)"></span>
            <span id="qTyp" class="badge" style="background:rgba(212,160,74,.12);color:var(--accent);font-size:0.7rem;"></span>
            <span id="qLevel" class="badge" style="background:var(--bg2);color:var(--muted);font-size:0.7rem;"></span>
        </div>
    </div>
    <div class="w-full h-1.5 rounded-full mb-5" style="background:var(--border)">
        <div id="qBar" class="h-full rounded-full" style="background:var(--accent);width:0%"></div>
    </div>
    <div id="qArea"></div>
    <div class="flex items-center justify-between mt-7">
        <button id="bPrv" onclick="qPrev()" class="bs" style="visibility:hidden"><i class="fa-solid fa-chevron-left mr-1"></i>Sebelumnya</button>
        <button id="bNxt" onclick="qNext()" class="bp">Selanjutnya <i class="fa-solid fa-chevron-right ml-1"></i></button>
    </div>
</div>
</div>

<!-- RESULTS -->
<div id="vRes" class="view pt-16 pb-12 px-4">
<div class="max-w-3xl mx-auto text-center">
    <div class="mb-7">
        <svg class="mx-auto mb-3" style="transform:rotate(-90deg)" width="130" height="130" viewBox="0 0 130 130">
            <circle cx="65" cy="65" r="55" fill="none" stroke="var(--border)" stroke-width="7"/>
            <circle id="rRing" cx="65" cy="65" r="55" fill="none" stroke="var(--accent)" stroke-width="7" stroke-linecap="round" stroke-dasharray="345.6" stroke-dashoffset="345.6"/>
        </svg>
        <div class="text-3xl font-bold" style="color:var(--accent)" id="rPct">0%</div>
        <div class="text-sm mt-0.5" style="color:var(--muted)" id="rLbl">—</div>
    </div>
    <div class="grid grid-cols-3 gap-3 mb-7">
        <div class="rounded-xl p-3.5" style="background:var(--card);border:1px solid var(--border)">
            <div class="text-2xl font-bold" style="color:var(--success)" id="rOk">0</div>
            <div class="text-xs" style="color:var(--muted)">Benar</div>
        </div>
        <div class="rounded-xl p-3.5" style="background:var(--card);border:1px solid var(--border)">
            <div class="text-2xl font-bold" style="color:var(--error)" id="rNo">0</div>
            <div class="text-xs" style="color:var(--muted)">Salah</div>
        </div>
        <div class="rounded-xl p-3.5" style="background:var(--card);border:1px solid var(--border)">
            <div class="text-2xl font-bold" id="rTot">0</div>
            <div class="text-xs" style="color:var(--muted)">Total</div>
        </div>
    </div>
    <div class="flex flex-wrap justify-center gap-2.5">
        <button onclick="location.href='index.html'" class="bs"><i class="fa-solid fa-house mr-1"></i>Beranda</button>
        <button onclick="revWrong()" class="bp" id="bRW" style="display:none"><i class="fa-solid fa-eye mr-1"></i>Review Salah</button>
        <button onclick="retryQ()" class="bs"><i class="fa-solid fa-rotate-left mr-1"></i>Ulangi</button>
    </div>
</div>
</div>

<!-- REVIEW -->
<div id="vRev" class="view pt-16 pb-12 px-4">
<div class="max-w-3xl mx-auto">
    <button onclick="backRev()" class="flex items-center gap-2 text-sm mb-5" style="color:var(--muted);background:none;border:none;cursor:pointer;"><i class="fa-solid fa-arrow-left"></i>Kembali</button>
    <div id="revA"></div>
    <div class="flex justify-center gap-2.5 mt-7">
        <button id="rvPr" onclick="rvNav(-1)" class="bs"><i class="fa-solid fa-chevron-left mr-1"></i>Sebelumnya</button>
        <button id="rvNx" onclick="rvNav(1)" class="bp">Selanjutnya <i class="fa-solid fa-chevron-right ml-1"></i></button>
    </div>
</div>
</div>

<div id="exMod" class="modal-bg">
    <div class="rounded-xl p-5 max-w-sm w-full" style="background:var(--card);border:1px solid var(--border)">
        <h3 class="fd text-lg font-bold mb-1.5">Keluar dari Quiz?</h3>
        <p class="text-sm mb-4" style="color:var(--muted)">Progress quiz ini akan hilang.</p>
        <div class="flex gap-2.5 justify-end">
            <button onclick="closeMod()" class="bs text-sm">Batal</button>
            <button onclick="doExit()" class="text-sm font-bold px-4 py-2 rounded-lg border-none cursor-pointer" style="background:var(--error);color:#fff">Keluar</button>
        </div>
    </div>
</div>

<div id="toast" class="toast" style="display:none"></div>

<script>
// ================================================================
// DATA SOAL ELEKTROKIMIA - HOTS C2-C6 (DIREVISI)
// ================================================================
var QS = [];

// ================================================================
// LEVEL C2 — Pemahaman Dasar (4 soal)
// ================================================================

// id:20 — tetap, sudah bagus
QS.push({
  id: 20, topic: "elektro", type: "single", level: "c2",
  stim: `
    <div class="stim">
      <p>Baterai seng-karbon (sel Leclanche): seng teroksidasi di anoda, MnO₂ direduksi di katoda.</p>
    </div>
  `,
  q: "Peristiwa pada anoda baterai tersebut adalah...",
  opts: [
    "Oksidasi ion Zn²⁺ yang menarik elektron dari sirkuit",
    "Reduksi logam seng yang melepaskan elektron",
    "Oksidasi logam seng yang kehilangan elektron membentuk Zn²⁺",
    "Reduksi MnO₂ yang mendapatkan elektron dari seng",
    "Pembentukan gas NH₃ akibat oksidasi NH₄⁺"
  ],
  ans: 2,
  exp: "Anoda = oksidasi. Zn(s) → Zn²⁺ + 2e⁻. Logam seng kehilangan elektron (teroksidasi)."
});

// id:21 — tetap, sudah bagus
QS.push({
  id: 21, topic: "elektro", type: "single", level: "c2",
  stim: `
    <div class="stim">
      <p>Proteksi katodik: pipa baja dihubungkan ke Mg batangan yang lebih reaktif.</p>
    </div>
  `,
  q: "Peran magnesium dalam sistem ini adalah...",
  opts: [
    "Mg sebagai katoda, tempat reduksi ion besi",
    "Mg adalah agen pengoksidasi",
    "Mg sebagai anoda, teroksidasi dan menyediakan elektron",
    "Mg menerima elektron dari baja",
    "Mg bereaksi langsung dengan karat"
  ],
  ans: 2,
  exp: "Logam kurban (Mg) menjadi anoda: Mg → Mg²⁺ + 2e⁻. Elektron mengalir ke baja (katoda), mencegah oksidasi Fe."
});

// id:22 — tetap, sudah bagus
QS.push({
  id: 22, topic: "elektro", type: "single", level: "c2",
  stim: `
    <div class="stim">
      <p>Elektroplating cincin tembaga dengan perak dari larutan AgNO₃. Arus 0,5 A selama 3 menit.</p>
    </div>
    <div style="font-size:0.85rem;color:var(--muted);">
      <i class="fa-solid fa-info-circle"></i> Ar Ag = 108, F = 96485 C/mol
    </div>
  `,
  q: "Massa perak yang melapisi cincin adalah sekitar...",
  opts: ["0,084 gram", "0,100 gram", "0,150 gram", "0,202 gram", "0,250 gram"],
  ans: 1,
  exp: "Q = 0,5 × 180 = 90 C. mol e⁻ = 90/96485 ≈ 0,000933. Ag⁺ + e⁻ → Ag, m = 0,000933 × 108 ≈ 0,101 g ≈ 0,100 g."
});

// id:23 — DIPERBAIKI: dari MCMA 1 kunci jadi single choice
QS.push({
  id: 23, topic: "elektro", type: "single", level: "c2",
  stim: `
    <div class="chem-eq">Elektrolisis larutan AgNO₃ dengan elektroda Pt (inert)</div>
  `,
  q: "Reaksi dan produk utama pada KATODA adalah...",
  opts: [
    "Ion nitrat teroksidasi menghasilkan NO₂",
    "Air teroksidasi menghasilkan O₂",
    "Ion perak tereduksi menjadi endapan logam perak",
    "Pt teroksidasi membentuk ion platina",
    "Ion perak mengalami oksidasi menjadi perak oksida"
  ],
  ans: 2,
  exp: "Katoda = reduksi. Ag⁺ lebih mudah tereduksi (E° = +0,80 V) dibanding air. Reaksi: Ag⁺ + e⁻ → Ag(s). Pt inert, tidak bereaksi."
});

// id:24 — DIPERBAIKI: dari MCMA 2 kunci jadi 3 kunci
QS.push({
  id: 24, topic: "elektro", type: "mcma", level: "c2",
  q: "Karakteristik utama sel volta yang BENAR adalah... (Pilih 3 jawaban benar)",
  opts: [
    "Mengubah energi kimia menjadi energi listrik (reaksi spontan)",
    "Anoda pada sel volta = tempat oksidasi dan bermuatan negatif",
    "Elektron bergerak dari katoda ke anoda melalui sirkuit eksternal",
    "Reaksi redoks berlangsung spontan, menghasilkan arus listrik",
    "Sel volta selalu menggunakan elektroda sama dengan larutan elektrolit",
    "Katoda pada sel volta = tempat reduksi dan bermuatan positif"
  ],
  ans: [0, 1, 3, 5],
  exp: "Sel volta: reaksi spontan, kimia→listrik. Anoda = oksidasi, muatan NEGATIF. Katoda = reduksi, muatan POSITIF. Elektron mengalir anoda→katoda (opsi C salah). Elektroda tidak harus sama dengan elektrolit."
});

// ================================================================
// LEVEL C3 — Menganalisis (5 soal)
// ================================================================

// C3.1 (id:3001) — tetap, sudah bagus
QS.push({
  id: 3001, topic: "elektro", type: "single", level: "c3",
  stim: `
    <div class="figure-wrap">
      <svg width="400" height="220" viewBox="0 0 400 220">
        <rect x="40" y="60" width="100" height="100" rx="5" fill="rgba(96,165,250,0.05)" stroke="rgba(96,165,250,0.3)" stroke-width="1.5"/>
        <text x="65" y="115" fill="#8fa89e" font-size="9">ZnSO₄</text>
        <rect x="80" y="30" width="20" height="80" rx="2" fill="rgba(52,211,153,0.4)" stroke="#34d399" stroke-width="2"/>
        <text x="78" y="25" fill="#34d399" font-size="10" font-weight="bold">Zn</text>
        <rect x="240" y="60" width="100" height="100" rx="5" fill="rgba(96,165,250,0.05)" stroke="rgba(96,165,250,0.3)" stroke-width="1.5"/>
        <text x="265" y="115" fill="#8fa89e" font-size="9">CuSO₄</text>

        <li>Sel volta mengubah energi kimia menjadi energi listrik.</li>
        <li>Sel elektrolisis mengubah energi listrik menjadi energi kimia.</li>
        <li>Pada sel volta, anoda bermuatan positif.</li>
        <li>Pada sel elektrolisis, katoda bermuatan negatif.</li>
        <li>Reaksi pada sel volta berlangsung spontan.</li>
      </ol>
    </div>
  `,
  q: "Penilaian yang PALING TEPAT terhadap ringkasan siswa adalah...",
  opts: [
    "Pernyataan 1, 2, 4, dan 5 benar; pernyataan 3 salah",
    "Pernyataan 1, 2, dan 3 benar; pernyataan 4 dan 5 salah",
    "Hanya pernyataan 1 dan 3 yang benar",
    "Semua pernyataan benar",
    "Semua pernyataan salah"
  ],
  ans: 0,
  exp: "Pernyataan 1, 2, 4, 5 benar. Pernyataan 3 SALAH: pada sel volta, anoda bermuatan NEGATIF (bukan positif). Pada sel elektrolisis, anoda bermuatan positif."
});

// C6.2 (id:6002) — DIPERBAIKI: kunci ditambah (C juga benar)
QS.push({
  id: 6002, topic: "elektro", type: "mcma", level: "c6",
  stim: `
    <div class="table-wrap">
      <table class="soal-table">
        <tr><th>Logam</th><th>E° Reduksi (V)</th><th>Biaya</th><th>Ketersediaan</th></tr>
        <tr><td>Mg</td><td>-2,37</td><td>Sedang</td><td>Melimpah</td></tr>
        <tr><td>Zn</td><td>-0,76</td><td>Rendah</td><td>Melimpah</td></tr>
        <tr><td>Al</td><td>-1,66</td><td>Rendah</td><td>Melimpah</td></tr>
        <tr><td>Cu</td><td>+0,34</td><td>Tinggi</td><td>Terbatas</td></tr>
        <tr><td>Ag</td><td>+0,80</td><td>Sangat tinggi</td><td>Terbatas</td></tr>
      </table>
    </div>
  `,
  q: "Berdasarkan data di atas, rekomendasi logam yang PALING TEPAT untuk anoda korban adalah... (Pilih 3 logam yang tepat)",
  opts: [
    "Mg karena memiliki potensial paling negatif",
    "Zn karena murah dan efektif",
    "Al karena murah dan ringan",
    "Cu karena tahan korosi",
    "Ag karena memiliki potensial positif"
  ],
  ans: [0, 1, 2],
  exp: "Anoda korban harus memiliki E° lebih negatif dari Fe (-0,44 V). Mg (-2,37 V), Zn (-0,76 V), dan Al (-1,66 V) memenuhi. Mg paling efektif, Zn dan Al lebih ekonomis. Cu dan Ag (E° positif) tidak dapat menjadi anoda korban."
});

// C6.3 (BARU) — Nilai klaim efisiensi
QS.push({
  id: 6003, topic: "elektro", type: "single", level: "c6",
  stim: `
    <div class="stim">
      <p>Tiga siswa berdebat tentang pemilihan metode perlindungan besi dari korosi:</p>
      <ul style="margin-left:1.2rem;">
        <li><strong>Siswa A:</strong> "Pengecatan adalah solusi terbaik karena murah dan mudah."</li>
        <li><strong>Siswa B:</strong> "Proteksi katodik dengan Mg lebih baik untuk pipa bawah tanah karena tidak perlu perawatan ulang."</li>
        <li><strong>Siswa C:</strong> "Galvanisasi dengan Zn adalah kompromi terbaik: murah dan Zn juga melindungi besi jika lapisan tergores."</li>
      </ul>
    </div>
  `,
  q: "Penilaian yang PALING TEPAT untuk pipa besi bawah tanah adalah...",
  opts: [
    "Siswa B dan C benar karena keduanya memberikan perlindungan berkelanjutan, sedangkan pengecatan perlu perawatan",
    "Siswa A benar karena pengecatan paling murah",
    "Siswa A dan B sama-sama benar untuk semua kondisi",
    "Ketiga siswa benar untuk semua kondisi",
    "Ketiga siswa salah karena besi tidak dapat dilindungi"
  ],
  ans: 0,
  exp: "Siswa B dan C benar untuk pipa bawah tanah. Pengecatan (A) kurang efektif karena sulit dirawat ulang. Proteksi katodik (B) dan galvanisasi (C) memberikan perlindungan berkelanjutan. Galvanisasi lebih ekonomis."
});

// ================================================================
// STATE MANAGEMENT
// ================================================================
var S = {
  view: "home", qids: [], qi: 0, ans: {}, mode: "topic",
  ri: 0, rqs: [], wrong: [], done: {}, scores: {}, filter: "all"
};

function load() {
  try {
    var d = JSON.parse(localStorage.getItem("tka_kim_elektro"));
    if (d) {
      S.done = {};
      (d.done || []).forEach(function(x) { S.done[x] = true; });
      S.wrong = d.wrong || [];
      S.scores = d.scores || {};
    }
  } catch(e) {}
}
function save() {
  try {
    localStorage.setItem("tka_kim_elektro", JSON.stringify({
      done: Object.keys(S.done), wrong: S.wrong, scores: S.scores
    }));
  } catch(e) {}
}
load();

function go(v) {
  var names = {home:"vHome", quiz:"vQuiz", res:"vRes", rev:"vRev"};
  document.querySelectorAll(".view").forEach(function(el) { el.classList.remove("active"); });
  var el = document.getElementById(names[v]);
  if (el) el.classList.add("active");
  S.view = v;
  window.scrollTo(0, 0);
  if (v === "home") renderHome();
}

function renderHome() {
  document.getElementById("bWR").style.display = S.wrong.length > 0 ? "flex" : "none";
  updateNS();
  renderList();
}

function updateNS() {
  var tc = 0, cc = 0;
  for (var k in S.scores) { tc += S.scores[k].t; cc += S.scores[k].c; }
  document.getElementById("nst").textContent = tc > 0 ? cc + "/" + tc : "0/0";
}

function getLevelBadge(level) {
  var labels = {c2:"C2", c3:"C3", c4:"C4", c5:"C5", c6:"C6"};
  var colors = {c2:"#34d399", c3:"#fbbf24", c4:"#f97316", c5:"#ef4444", c6:"#8b5cf6"};
  var bgColors = {
    c2:"rgba(52,211,153,0.15)", c3:"rgba(251,191,36,0.15)",
    c4:"rgba(249,115,22,0.15)", c5:"rgba(239,68,68,0.15)",
    c6:"rgba(139,92,246,0.15)"
  };
  return '<span class="badge" style="background:' + bgColors[level] + ';color:' + colors[level] + ';font-size:0.65rem;">' + labels[level] + '</span>';
}

function renderList() {
  var list = document.getElementById("qList");
  list.innerHTML = "";
  var filtered = QS.filter(function(q) {
    if (S.filter === "all") return true;
    return q.level === S.filter;
  });
  filtered.forEach(function(q, i) {
    var answered = S.done[q.id];
    var wasWrong = S.wrong.indexOf(q.id) >= 0;
    var tl = q.type === "mcma" ? "MCMA" : "Pilihan Ganda";
    var levelLabel = q.level ? getLevelBadge(q.level) : "";

    var d = document.createElement("div");
    d.className = "glow-card";
    d.style.cursor = "pointer";
    d.onclick = function() { singleQ(q.id); };
    d.innerHTML =
      '<div class="w-9 h-9 rounded-lg flex items-center justify-center text-sm font-bold flex-shrink-0" style="background:' +
        (answered ? (wasWrong ? 'rgba(248,113,113,.12);color:var(--error)' : 'rgba(52,211,153,.12);color:var(--success)') : 'var(--bg2);color:var(--muted)') +
      '">' + (answered ? (wasWrong ? '<i class="fa-solid fa-xmark"></i>' : '<i class="fa-solid fa-check"></i>') : (i + 1)) + '</div>' +
      '<div class="flex-1 min-w-0">' +
        '<div class="text-sm font-semibold mb-0.5 truncate" style="color:var(--text)">' + plain(q.q).substring(0, 75) + (q.q.length > 75 ? '...' : '') + '</div>' +
        '<div class="flex items-center gap-2 flex-wrap">' +
          '<span class="badge" style="background:var(--bg2);color:var(--muted);font-size:.68rem">' + tl + '</span>' +
          levelLabel +
        '</div>' +
      '</div>' +
      '<i class="fa-solid fa-chevron-right text-xs" style="color:var(--border)"></i>';
    list.appendChild(d);
  });
}

function filterLevel(level) {
  S.filter = level;
  document.querySelectorAll('[id^="filter"]').forEach(function(el) {
    el.style.background = "transparent";
  });
  var btn = document.getElementById("filter" + level.toUpperCase());
  if (btn) btn.style.background = "rgba(212,160,74,.15)";
  renderList();
}

function plain(html) {
  var d = document.createElement("div");
  d.innerHTML = html;
  return d.textContent || "";
}

function startQuiz() {
  S.qids = QS.map(function(q) { return q.id; });
  S.ans = {}; S.qi = 0; S.mode = "topic";
  go("quiz"); renderQ();
}
function startRandom() {
  var sh = QS.slice().sort(function() { return Math.random() - 0.5; }).slice(0, 10);
  S.qids = sh.map(function(q) { return q.id; });
  S.ans = {}; S.qi = 0; S.mode = "random";
  go("quiz"); renderQ();
}
function startWrong() {
  var wq = QS.filter(function(q) { return S.wrong.indexOf(q.id) >= 0; });
  if (wq.length === 0) return;
  S.qids = wq.map(function(q) { return q.id; });
  S.ans = {}; S.qi = 0; S.mode = "wrong";
  go("quiz"); renderQ();
}
function singleQ(qid) {
  S.qids = [qid]; S.ans = {}; S.qi = 0; S.mode = "single";
  go("quiz"); renderQ();
}

function renderQ() {
  var qid = S.qids[S.qi];
  var q = QS.find(function(x) { return x.id === qid; });
  if (!q) return;
  var total = S.qids.length;
  var idx = S.qi + 1;
  var pct = Math.round(idx / total * 100);

  document.getElementById("qCtr").textContent = idx + " / " + total;
  document.getElementById("qBar").style.width = pct + "%";
  var tl = {single: "Pilihan Ganda", mcma: "MCMA"};
  document.getElementById("qTyp").textContent = tl[q.type] || q.type;
  var levelLabels = {c2:"C2 - Pemahaman", c3:"C3 - Menganalisis", c4:"C4 - Mengevaluasi", c5:"C5 - Mencipta", c6:"C6 - Menilai"};
  document.getElementById("qLevel").textContent = q.level ? levelLabels[q.level] : "";
  document.getElementById("bPrv").style.visibility = S.qi > 0 ? "visible" : "hidden";
  var isLast = S.qi === total - 1;
  document.getElementById("bNxt").innerHTML = isLast ? "Selesai <i class='fa-solid fa-check ml-1'></i>" : "Selanjutnya <i class='fa-solid fa-chevron-right ml-1'></i>";

  var h = "";
  if (q.stim) h += '<div class="stim">' + q.stim + '</div>';
  h += '<h3 class="font-bold text-base mb-4 leading-relaxed" style="color:var(--text)">' + q.q + '</h3>';

  if (q.type === "single") {
    var letters = "ABCDE";
    h += '<div class="space-y-2.5">';
    q.opts.forEach(function(opt, i) {
      var sel = S.ans[qid] === i;
      h += '<button class="ob' + (sel ? ' sel' : '') + '" onclick="selS(' + qid + ',' + i + ')">' +
        '<span class="w-7 h-7 min-w-[1.75rem] rounded-full border-2 flex items-center justify-center text-xs font-bold flex-shrink-0" style="border-color:' + (sel ? 'var(--accent)' : 'var(--border)') + ';color:' + (sel ? 'var(--accent)' : 'var(--muted)') + '">' + letters[i] + '</span>' +
        '<span class="text-sm">' + opt + '</span></button>';
    });
    h += '</div>';
  } else if (q.type === "mcma") {
    var ua = S.ans[qid] || [];
    h += '<div class="space-y-2.5">';
    q.opts.forEach(function(opt, i) {
      var sel = ua.indexOf(i) >= 0;
      h += '<button class="ob' + (sel ? ' sel' : '') + '" onclick="togM(' + qid + ',' + i + ')">' +
        '<div class="ck">' + (sel ? '<i class="fa-solid fa-check text-xs" style="color:#0b1a17"></i>' : '') + '</div>' +
        '<span class="text-sm">' + opt + '</span></button>';
    });
    h += '</div>';
    h += '<p class="text-xs mt-2.5" style="color:var(--muted)"><i class="fa-solid fa-circle-info mr-1"></i>Pilih SEMUA jawaban yang benar</p>';
  }
  document.getElementById("qArea").innerHTML = h;
}

function selS(qid, i) { S.ans[qid] = i; renderQ(); }
function togM(qid, i) {
  if (!S.ans[qid]) S.ans[qid] = [];
  var arr = S.ans[qid];
  var idx = arr.indexOf(i);
  if (idx >= 0) arr.splice(idx, 1); else arr.push(i);
  renderQ();
}

function qNext() {
  if (S.qi === S.qids.length - 1) { finishQ(); return; }
  S.qi++; renderQ(); window.scrollTo(0, 0);
}
function qPrev() {
  if (S.qi > 0) { S.qi--; renderQ(); window.scrollTo(0, 0); }
}

function finishQ() {
  var correct = 0, wrong = 0;
  var ts = {};
  S.qids.forEach(function(qid) {
    var q = QS.find(function(x) { return x.id === qid; });
    if (!q) return;
    var ua = S.ans[qid];
    var ok = false;
    if (q.type === "single") ok = ua === q.ans;
    else if (q.type === "mcma") {
      var u = (ua || []).slice().sort().join(",");
      var c = q.ans.slice().sort().join(",");
      ok = u === c;
    }
    S.done[qid] = true;
    if (ok) correct++; else { wrong++; S.wrong.push(qid); }
    if (!ts[q.topic]) ts[q.topic] = {c:0, t:0};
    ts[q.topic].t++;
    if (ok) ts[q.topic].c++;
  });
  S.wrong = uniq(S.wrong);
  for (var k in ts) {
    if (!S.scores[k]) S.scores[k] = {c:0, t:0};
    S.scores[k].c += ts[k].c;
    S.scores[k].t += ts[k].t;
  }
  save();

  var total = correct + wrong;
  var pct = total > 0 ? Math.round(correct / total * 100) : 0;
  document.getElementById("rPct").textContent = pct + "%";
  document.getElementById("rOk").textContent = correct;
  document.getElementById("rNo").textContent = wrong;
  document.getElementById("rTot").textContent = total;

  var circ = 2 * Math.PI * 55;
  var ring = document.getElementById("rRing");
  ring.style.strokeDasharray = circ;
  ring.style.strokeDashoffset = circ - (circ * pct / 100);
  ring.style.stroke = pct >= 70 ? "var(--success)" : pct >= 40 ? "var(--accent)" : "var(--error)";

  var lbl = pct >= 90 ? "Luar Biasa!" : pct >= 70 ? "Bagus Sekali!" : pct >= 50 ? "Cukup Baik" : "Perlu Belajar Lagi";
  document.getElementById("rLbl").textContent = lbl;
  document.getElementById("bRW").style.display = wrong > 0 ? "inline-flex" : "none";
  go("res");
}

function uniq(arr) {
  var seen = {}, out = [];
  arr.forEach(function(x) { if (!seen[x]) { seen[x] = true; out.push(x); } });
  return out;
}

function retryQ() {
  if (S.mode === "topic") startQuiz();
  else if (S.mode === "random") startRandom();
  else if (S.mode === "wrong") startWrong();
  else if (S.mode === "single") singleQ(S.qids[0]);
}

function revWrong() {
  var wqs = S.qids.filter(function(qid) { return S.wrong.indexOf(qid) >= 0; });
  if (wqs.length === 0) { toast("Tidak ada jawaban salah", "var(--success)"); return; }
  S.rqs = wqs.map(function(qid) { return QS.find(function(x) { return x.id === qid; }); }).filter(Boolean);
  S.ri = 0;
  go("rev"); renderRev();
}

function renderRev() {
  var q = S.rqs[S.ri];
  if (!q) return;
  var total = S.rqs.length;
  document.getElementById("rvPr").style.visibility = S.ri > 0 ? "visible" : "hidden";
  document.getElementById("rvNx").innerHTML = S.ri === total - 1 ? "Kembali <i class='fa-solid fa-check ml-1'></i>" : "Selanjutnya <i class='fa-solid fa-chevron-right ml-1'></i>";

  var ua = S.ans[q.id];
  var ok = false;
  if (q.type === "single") ok = ua === q.ans;
  else if (q.type === "mcma") {
    var u = (ua || []).slice().sort().join(",");
    ok = u === q.ans.slice().sort().join(",");
  }

  var letters = "ABCDE";
  var h = '<div class="text-xs mb-2 font-semibold" style="color:var(--muted)">Soal ' + (S.ri + 1) + " / " + total + '</div>';
  if (q.stim) h += '<div class="stim">' + q.stim + '</div>';
  h += '<h3 class="font-bold text-sm mb-4 leading-relaxed">' + q.q + '</h3>';
  h += '<div class="space-y-2.5">';

  if (q.type === "single") {
    q.opts.forEach(function(opt, i) {
      var cls = "off";
      if (i === q.ans) cls += " ok";
      else if (ua === i && i !== q.ans) cls += " no";
      h += '<button class="ob ' + cls + '">' +
        '<span class="w-7 h-7 min-w-[1.75rem] rounded-full border-2 flex items-center justify-center text-xs font-bold flex-shrink-0" style="border-color:' + (i === q.ans ? "var(--success)" : ua === i ? "var(--error)" : "var(--border)") + ';color:' + (i === q.ans ? "var(--success)" : ua === i ? "var(--error)" : "var(--muted)") + '">' + letters[i] + '</span>' +
        '<span class="text-sm">' + opt + '</span>' +
        (i === q.ans ? '<i class="fa-solid fa-circle-check ml-auto" style="color:var(--success)"></i>' : '') +
        (ua === i && i !== q.ans ? '<i class="fa-solid fa-circle-xmark ml-auto" style="color:var(--error)"></i>' : '') +
      '</button>';
    });
  } else if (q.type === "mcma") {
    q.opts.forEach(function(opt, i) {
      var isUA = (ua || []).indexOf(i) >= 0;
      var isCA = q.ans.indexOf(i) >= 0;
      var cls = "off";
      if (isCA) cls += " ok";
      else if (isUA && !isCA) cls += " no";
      h += '<button class="ob ' + cls + '">' +
        '<div class="ck">' + (isCA ? '<i class="fa-solid fa-check text-xs" style="color:#0b1a17"></i>' : isUA ? '<i class="fa-solid fa-xmark text-xs" style="color:#fff"></i>' : '') + '</div>' +
        '<span class="text-sm">' + opt + '</span></button>';
    });
  }
  h += '</div>';
  h += '<div class="expbox ' + (ok ? 'good' : 'bad') + '">' +
    '<div class="flex items-center gap-2 mb-1.5 font-bold text-sm">' +
      '<i class="fa-solid ' + (ok ? 'fa-circle-check' : 'fa-circle-xmark') + '" style="color:' + (ok ? 'var(--success)' : 'var(--error)') + '"></i>' +
      (ok ? 'Jawaban Benar' : 'Jawaban Salah') +
    '</div>' +
    '<p style="color:var(--text);line-height:1.6;font-size:0.9rem;">' + q.exp + '</p>' +
  '</div>';

  document.getElementById("revA").innerHTML = h;
  window.scrollTo(0, 0);
}

function rvNav(dir) {
  if (dir === 1 && S.ri === S.rqs.length - 1) { backRev(); return; }
  S.ri = Math.max(0, Math.min(S.rqs.length - 1, S.ri + dir));
  renderRev();
}
function backRev() {
  if (S.mode === "single") go("home");
  else go("res");
}

function openExit() { document.getElementById("exMod").classList.add("open"); }
function closeMod() { document.getElementById("exMod").classList.remove("open"); }
function doExit() { closeMod(); go("home"); }

function resetAll() {
  S.done = {}; S.wrong = []; S.scores = {};
  save(); renderHome(); toast("Progress berhasil direset", "var(--success)");
}
function toast(msg, bg) {
  var t = document.getElementById("toast");
  t.style.display = "block";
  t.style.background = bg || "var(--card)";
  t.style.color = "#fff";
  t.textContent = msg;
  setTimeout(function() { t.style.display = "none"; }, 2200);
}

renderHome();
console.log("Elektrokimia - HOTS C2-C6 loaded: " + QS.length + " soal");
</script>
</body>
</html>
